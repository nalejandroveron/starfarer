syntax = "proto3";

package starfarer.protocol.v1;

option csharp_namespace = "Starfarer.Protocol.V1";
option go_package = "starfarer/internal/protocol/v1;protocolv1";

message Hello {
  string client_version = 1;
}

message Welcome {
  uint64 player_id = 1;
}

message PlayerInput {
  uint64 sequence = 1;
  float move_x = 2;
  float move_z = 3;
}

message PlayerState {
  uint64 player_id = 1;

  float position_x = 2;
  float position_z = 3;

  uint64 last_processed_input = 4;
}

// Diagnostic state only; this is not a game simulation.
message WorldSnapshot {
  uint64 tick = 1;
  repeated PlayerState players = 2;
}

message ClientEvents {
  uint32 protocol_version = 1;

  oneof event {
    Hello hello = 10;
    PlayerInput player_input = 11;
  }
}

message ServerEvents {
  uint32 protocol_version = 1;

  oneof event {
    Welcome welcome = 10;
    WorldSnapshot snapshot = 11;
  }
}
